            };
            // END TESTABLE REQUEST REGISTRATION
            let triggerComments = [];
            let requestStatuses = [];
            let latestPotentialRequest;
            let latestPotentialRequestRegistered = false;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              [triggerComments, requestStatuses] = await Promise.all([
                github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: pullNumber, per_page: 100,
                }),
                github.paginate(
                  github.rest.repos.listCommitStatusesForRef,
                  {owner, repo, ref: currentHead, per_page: 100},
                ),
              ]);
              await refreshRequesterPermissions(triggerComments, requestStatuses);
              const potentialRequests = triggerComments.map(comment => ({
                comment,
                requestTime: Date.parse(comment.created_at || ""),
                updatedTime: Date.parse(comment.updated_at || ""),
              })).filter(({comment, requestTime, updatedTime}) => {
                const contextMatch = /;context=(.*?) -->/.exec(comment.body || "");
                return isOwnerRequest(comment) && contextMatch && contextMatch[1] &&
                  (comment.body || "") === `@codex review\n\n${baseMarker}context=${contextMatch[1]} -->` &&
                  Number.isFinite(requestTime) && requestTime <= artifactTime &&
                  Number.isFinite(updatedTime) && updatedTime === requestTime;
              }).sort((left, right) =>
                left.requestTime - right.requestTime || left.comment.id - right.comment.id);
              latestPotentialRequest = potentialRequests[potentialRequests.length - 1];
              const visibleRegistrations = registeredRequestIdsFromStatuses(requestStatuses);
              latestPotentialRequestRegistered = Boolean(latestPotentialRequest) &&
                visibleRegistrations.has(latestPotentialRequest.comment.id);
              if (latestPotentialRequestRegistered) break;
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!latestPotentialRequestRegistered) {
              core.info("No registered Codex review request materialized for this artifact");
              return;
            }
            const registeredRequestIds = historicalRequestIdsFromStatuses(requestStatuses);
            // BEGIN TESTABLE REQUEST ELIGIBILITY
            const requestContextFromBody = body => {
              const contextMatch = /;context=(.*?) -->/.exec(body || "");
              const token = contextMatch && contextMatch[1] ? contextMatch[1] : "";
              return token && token.trim() === token ? token : "";
            };
            const requestOrder = (left, right) =>
              left.requestTime - right.requestTime || left.comment.id - right.comment.id;
            const requestCandidates = (comments, beforeTime, registrations = registeredRequestIds) => comments.map(
              comment => ({
                comment,
                requestTime: Date.parse(comment.created_at || ""),
                updatedTime: Date.parse(comment.updated_at || ""),
              }),
            ).filter(
              ({comment, requestTime, updatedTime}) =>
                registrations.has(comment.id) &&
                Boolean(requestContextFromBody(comment.body)) &&
                (comment.body || "").includes(baseMarker) &&
                (comment.body || "") === `@codex review\n\n${baseMarker}context=${requestContextFromBody(comment.body)} -->` &&
                Number.isFinite(requestTime) && requestTime <= beforeTime &&
                Number.isFinite(updatedTime) && updatedTime === requestTime,
            ).sort(requestOrder);
            const hasTerminalGateBefore = (request, contextToken, nextRequestTime, checkRuns) => {
              const prefix = requestGateExternalIdPrefix(
                pullNumber,
                currentBase,
                contextToken,
                request.comment.id,
                request.requestTime,
              );
              return checkRuns.some(check => {
                const completedTime = Date.parse(check.completed_at || "");
                return check.app && check.app.id === 15368 &&
                  check.status === "completed" &&
                  (check.external_id === prefix ||
                   (check.external_id || "").startsWith(`${prefix}:artifact:`)) &&
                  Number.isFinite(completedTime) && completedTime < nextRequestTime;
              });
            };
            const eligibleReviewRequests = (
              comments, checkRuns, beforeTime, registrations = registeredRequestIds,
            ) => {
              // An edited registered request retains its historical identity but
              // no longer proves which artifact belongs to the current context.
              // Recovery requires a new head, even if a later request is exact.
              const history = comments.filter(comment => registrations.has(comment.id) &&
                Number.isFinite(Date.parse(comment.created_at || "")) &&
                Date.parse(comment.created_at) <= beforeTime);
              if (history.some(comment =>
                  comment.updated_at !== comment.created_at ||
                  !requestContextFromBody(comment.body) ||
                  (comment.body || "") !== `@codex review\n\n${baseMarker}context=${requestContextFromBody(comment.body)} -->`)) {
                return [];
              }
              const previousByContext = new Map();
              const eligible = [];
              for (const candidate of requestCandidates(comments, beforeTime, registrations)) {
                const requestContext = requestContextFromBody(candidate.comment.body);
                if (!requestContext) continue;
                const previous = previousByContext.get(requestContext);
                if (!previous ||
                    hasTerminalGateBefore(previous, requestContext, candidate.requestTime, checkRuns)) {
                  eligible.push({...candidate, contextToken: requestContext});
                }
                // Even an ineligible overlapping request can emit a late artifact.
                // The next request must follow this immediate predecessor's terminal
                // gate, rather than skipping it and reusing an older terminal gate.
                previousByContext.set(requestContext, candidate);
              }
              return eligible;
            };
            // Artifact attribution requires a serial request. Supersession must also
            // see overlapping registered requests, whose artifacts are ambiguous.
            const hasNewerRegisteredRequest = (comments, registrations, contextToken, request) =>
              comments.filter(comment => registrations.has(comment.id)).some(comment => {
                const candidateTime = Date.parse(comment.created_at || "");
                if (!Number.isFinite(candidateTime) ||
                    !(candidateTime > request.requestTime ||
                      (candidateTime === request.requestTime && comment.id > request.comment.id))) return false;
                const exact = comment.updated_at === comment.created_at &&
                  Boolean(requestContextFromBody(comment.body)) &&
                  (comment.body || "") === `@codex review\n\n${baseMarker}context=${requestContextFromBody(comment.body)} -->`;
                // An edited or erased marker cannot erase the newer registration.
                return !exact || requestContextFromBody(comment.body) === contextToken;
              });
            // END TESTABLE REQUEST ELIGIBILITY
            const candidateRequests = Number.isFinite(artifactTime)
              ? eligibleReviewRequests(triggerComments, artifactChecks, artifactTime)
                .sort((left, right) => -requestOrder(left, right))
              : [];
            const pendingRequest = candidateRequests[0];
            if (pendingRequest) {
              const pendingRequestPrefix = requestGateExternalIdPrefix(
                pullNumber,
                currentBase,
                pendingRequest.contextToken,
                pendingRequest.comment.id,
                pendingRequest.requestTime,
              );
              const pendingRequestAlreadyTerminal = artifactChecks.some(
                check => check.app && check.app.id === 15368 &&
                  check.status === "completed" &&
                  (check.external_id === pendingRequestPrefix ||
                   (check.external_id || "").startsWith(`${pendingRequestPrefix}:artifact:`)),
              );
              if (pendingRequestAlreadyTerminal) {
                core.info("This Codex review request already has a terminal SFL audit; verifying its required status");
              }
            }
            // BEGIN TESTABLE ACTIVE INVALIDATIONS
            const verifiedMaterializingRequests = new Set();
            const activeInvalidationRuns = async () => {
              const activeStatuses = ["requested", "queued", "in_progress", "waiting", "pending"];
              const events = ["pull_request_target", "push", "issue_comment"];
              const pages = await Promise.all(activeStatuses.map(status => github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner,
                  repo,
                  workflow_id: "sfl-pr-review-auto.yml",
                  status,
                  per_page: 100,
                },
                response => response.data,
              )));
              const candidates = pages.flat().filter(
                run => run.id !== context.runId && events.includes(run.event) &&
                  isActiveInvalidationRun(run, pullNumber, owner),
              );
              const statuses = candidates.some(run =>
                run.event === "issue_comment" && invalidationRequestCommentId(run, pullNumber) !== null)
                ? await github.paginate(github.rest.repos.listCommitStatusesForRef,
                    {owner, repo, ref: currentHead, per_page: 100})
                : [];
              const authorized = [];
              for (const run of candidates) {
                if (run.event !== "issue_comment") {
                  authorized.push(run);
                  continue;
                }
                const actor = ((run.actor && run.actor.login) || "").toLowerCase();
                const requestId = invalidationRequestCommentId(run, pullNumber);
                if (requestId === null) {
                  // Legacy deployed runs lack a comment ID; conservatively wait
                  // for an authorized actor's pre-upgrade invalidation to finish.
                  if (await requesterAllowed(actor)) authorized.push(run);
                  continue;
                }
                const target = `https://github.com/${owner}/${repo}/pull/${pullNumber}#issuecomment-${requestId}`.toLowerCase();
                const registrations = statuses.filter(status =>
                  status.context === "SFL Codex Review Request Registry" &&
                  (status.target_url || "").toLowerCase() === target &&
                  Boolean(status.creator && status.creator.login));
                // Registered authors may revoke their evidence after access loss.
                // A title with marker intent is only a candidate for a fresh request:
                // quoted or malformed markers must not block ordinary publication.
                const registeredInvalidation = registrations.length &&
                  (registrations.some(status => status.creator.login.toLowerCase() === actor) ||
                   await requesterAllowed(actor));
                const verifiedRequestIdentity = `${run.id}:${requestId}:${actor}`;
                let materializingRequest = verifiedMaterializingRequests.has(verifiedRequestIdentity);
                if (!registeredInvalidation && !materializingRequest && !registrations.length &&
                    run.display_title === `SFL Codex comment #${pullNumber} request ${requestId}` &&
                    await requesterAllowed(actor)) {
                  let comment;
                  try {
                    comment = (await github.rest.issues.getComment({
                      owner, repo, comment_id: requestId,
                    })).data;
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                  const token = requestContextFromBody(comment && comment.body);
                  materializingRequest = Boolean(comment && token &&
                    comment.id === requestId &&
                    (comment.html_url || "").toLowerCase() === target &&
                    ((comment.user && comment.user.login) || "").toLowerCase() === actor &&
                    Number.isFinite(Date.parse(comment.created_at || "")) &&
                    comment.updated_at === comment.created_at &&
                    comment.body === `@codex review\n\n${baseMarker}context=${token} -->`);
                  if (materializingRequest) {
                    const currentContextChecks = await github.paginate(github.rest.checks.listForRef,
                      {owner, repo, ref: currentHead, check_name: "SFL Reviewer Gate Runner",
                       filter: "all", per_page: 100}, response => response.data);
                    materializingRequest = reviewContextUnambiguous(currentContextChecks, pullNumber, currentBase) &&
                      currentContextChecks.some(check => check.app && check.app.id === 15368 &&
                        check.external_id === token);
