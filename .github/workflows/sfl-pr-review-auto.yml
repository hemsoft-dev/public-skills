              ? "A newer Codex review request superseded this result while it was being published"
              : state.lifecycleChanged
                ? "The pull request was closed or reopened while the Codex result was being published"
                : state.invalidationRuns.length > 0
                  ? "An SFL invalidation started while the Codex result was being published"
                  : "The pull request context changed while the Codex result was being published";
            // BEGIN TESTABLE TERMINAL PUBLICATION PREFLIGHT
            const terminalState = await publicationState();
            if (publicationChanged(terminalState)) {
              core.info(publicationChangeReason(terminalState));
              return;
            }
            // END TESTABLE TERMINAL PUBLICATION PREFLIGHT
            const existing = latestRequestChecks.find(
              check => check.app && check.app.id === 15368 &&
                check.status === "completed" &&
                (check.external_id === externalIdPrefix ||
                 (check.external_id || "").startsWith(`${externalIdPrefix}:artifact:`)),
            );
            if (existing) {
              const repair = requiredGateRepair(existing, latestRequestStatuses);
              if (repair) {
                if (repair.state === "success") {
                  const beforeRepairState = await publicationState();
                  if (publicationChanged(beforeRepairState)) {
                    core.info(publicationChangeReason(beforeRepairState));
                    return;
                  }
                }
                let repairFailureReason;
                let repairVerificationError;
                try {
                  await github.rest.repos.createCommitStatus({
                    owner,
                    repo,
                    sha: currentHead,
                    state: repair.state,
                    context: "SFL Reviewer Gate Runner",
                    target_url: existing.details_url || artifact.html_url || pull.data.html_url,
                    description: repair.state === "success"
                      ? "Restored the required status for the completed Codex review"
                      : "Restored the blocking status for the failed Codex review",
                  });
                  if (repair.state === "success") {
                    const repairedState = await publicationState();
                    if (publicationChanged(repairedState)) {
                      repairFailureReason = publicationChangeReason(repairedState);
                    }
                  }
                } catch (error) {
                  if (repair.state !== "success") throw error;
                  repairVerificationError = error;
                  repairFailureReason = "The required status repair could not be verified";
                }
                if (repairFailureReason) {
                  let blockingStatusError;
                  for (let attempt = 0; attempt < 3; attempt += 1) {
                    try {
                      await github.rest.repos.createCommitStatus({
                        owner,
                        repo,
                        sha: currentHead,
                        state: "failure",
                        context: "SFL Reviewer Gate Runner",
                        target_url: existing.details_url || artifact.html_url || pull.data.html_url,
                        description: "The reviewed pull request context could not be verified during status repair",
                      });
                      blockingStatusError = undefined;
                      break;
                    } catch (error) {
                      blockingStatusError = error;
                    }
                  }
                  core.setFailed(repairFailureReason);
                  if (blockingStatusError) core.info("The blocking status could not be restored after three attempts");
                  if (repairVerificationError) throw repairVerificationError;
                  if (blockingStatusError) throw blockingStatusError;
                  return;
                }
                core.info(`Restored the ${repair.state} required status from the terminal SFL audit`);
              }
              core.info("This Codex review request already has a terminal SFL gate");
              return;
            }
            const detailsURL = artifact.html_url || pull.data.html_url;
            if (result.action !== "success") {
              const publishedCompletedAt = new Date().toISOString();
              await github.rest.checks.create({
                owner,
                repo,
                name: "SFL Reviewer Gate Runner",
                head_sha: currentHead,
                status: "completed",
                conclusion: "failure",
                completed_at: publishedCompletedAt,
                details_url: detailsURL,
                external_id: externalId,
                output: {title, summary: result.reason},
              });
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: currentHead,
                state: "failure",
                context: "SFL Reviewer Gate Runner",
                target_url: detailsURL,
                description: "Codex review did not satisfy the required gate",
              });
              core.setFailed(result.reason);
              return;
            }
            const published = await github.rest.checks.create({
              owner,
              repo,
              name: "SFL Reviewer Gate Runner",
              head_sha: currentHead,
              status: "in_progress",
              started_at: new Date().toISOString(),
              details_url: detailsURL,
              external_id: externalId,
              output: {title: "SFL Codex review validating", summary: result.reason},
            });
            // BEGIN TESTABLE PUBLISHED CHECK UPDATE
            async function updatePublishedCheck(update) {
              for (let attempt = 0; attempt < 3; attempt += 1) {
                try {
                  return await github.rest.checks.update(update);
                } catch (error) {
                  if (error.status !== 404 || attempt === 2) throw error;
                  await new Promise(resolve => setTimeout(resolve, 1000));
                }
              }
            }
            // END TESTABLE PUBLISHED CHECK UPDATE
            let requiredPublished = null;
            const failPublishedSuccess = async changedReason => {
              core.setFailed(changedReason);
              let invalidationError;
              if (requiredPublished) {
                for (let attempt = 0; attempt < 3; attempt += 1) {
                  try {
                    await github.rest.repos.createCommitStatus({
                      owner,
                      repo,
                      sha: requiredGateSha,
                      state: "failure",
                      context: "SFL Reviewer Gate Runner",
                      target_url: detailsURL,
                      description: "The reviewed pull request context changed during publication",
                    });
                    invalidationError = undefined;
                    break;
                  } catch (error) {
                    invalidationError = error;
                  }
                }
              }
              try {
                await github.rest.checks.update({
                  owner,
                  repo,
                  check_run_id: published.data.id,
                  status: "completed",
                  conclusion: "failure",
                  completed_at: new Date().toISOString(),
                  details_url: detailsURL,
                  external_id: externalId,
                  output: {title: "SFL Codex review invalidated", summary: changedReason},
                });
              } catch (error) {
                invalidationError ||= error;
              }
              if (invalidationError) throw invalidationError;
            };
            const confirmedState = await publicationState();
            if (publicationChanged(confirmedState)) {
              await failPublishedSuccess(publicationChangeReason(confirmedState));
              return;
            }
            const requiredGateSha = requiredGateTarget(confirmedState.pull);
            requiredPublished = await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: requiredGateSha,
              state: "pending",
              context: "SFL Reviewer Gate Runner",
              target_url: detailsURL,
              description: "Validating Codex review for the immutable pull request head",
            });
            let publicationFailureReason;
            let publicationError;
            try {
              await updatePublishedCheck({
                owner,
                repo,
                check_run_id: published.data.id,
                status: "completed",
                conclusion: "success",
                completed_at: new Date().toISOString(),
                details_url: detailsURL,
                external_id: externalId,
                output: {title, summary: result.reason + "\n\n<!-- sfl-gate-execution:" + Buffer.from(JSON.stringify({
                  repository_id: context.payload.repository.id,
                  repository: `${owner}/${repo}`,
                  run_id: context.runId,
                  run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
                  execution_sha: context.sha,
                  workflow_sha: process.env.GITHUB_WORKFLOW_SHA,
                  workflow_path: ".github/workflows/sfl-pr-review-auto.yml",
                  event: context.eventName,
                  check_run_id: published.data.id,
                  external_id: externalId,
                })).toString("base64") + " -->"},
              });
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: requiredGateSha,
                state: "success",
                context: "SFL Reviewer Gate Runner",
                target_url: detailsURL,
                description: "Codex found no major issues on the reviewed pull request head",
              });
              const postSuccessState = await publicationState();
              if (publicationChanged(postSuccessState)) {
                publicationFailureReason = publicationChangeReason(postSuccessState);
              }
            } catch (error) {
              publicationError = error;
              publicationFailureReason = "The published Codex review gate could not be verified";
            }
            if (publicationFailureReason) {
              let invalidationError;
              try {
                await failPublishedSuccess(publicationFailureReason);
              } catch (error) {
                invalidationError = error;
                core.info("The published gate could not be fully invalidated");
              }
              if (publicationError) throw publicationError;
              if (invalidationError) throw invalidationError;
            }

  invalidate-pull-context:
    name: Invalidate Codex review for changed pull context
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      github.event.action == 'synchronize' ||
      github.event.changes.base)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sfl-codex-review-pull-context-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.ref == github.event.repository.default_branch || github.event.changes.base.ref.from == github.event.repository.default_branch }}
      cancel-in-progress: true
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Publish the blocking gate until the new diff is reviewed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            // BEGIN TESTABLE INVALIDATION ORDER
            function supersedesInvalidation(externalId, eventTime, runId) {
              const match = /^sfl-codex-review:(?:pull-context|base-advance):at:(\d+):(\d+)/.exec(externalId || "");
              if (!match) return false;
              const candidateTime = Number(match[1]);
              const candidateRunId = Number(match[2]);
              if (!Number.isSafeInteger(candidateTime) || !Number.isSafeInteger(candidateRunId)) return false;
              return candidateTime > eventTime ||
                (candidateTime === eventTime && candidateRunId > runId);
            }
            // END TESTABLE INVALIDATION ORDER

            const {owner, repo} = context.repo;
            const pull = context.payload.pull_request;
            const headRepo = pull.head.repo && pull.head.repo.full_name;
            // BEGIN TESTABLE SUPPORTED PULL CONTEXT
            const sameRepositoryHead = Boolean(headRepo) &&
              headRepo.toLowerCase() === `${owner}/${repo}`.toLowerCase();
            const baseChanged = context.payload.action === "edited" &&
              Boolean(context.payload.changes && context.payload.changes.base);
            const departedDefaultBranch = baseChanged &&
              context.payload.changes.base.ref &&
              context.payload.changes.base.ref.from === context.payload.repository.default_branch;
            const supportedPullContext = sameRepositoryHead &&
              (pull.base.ref === context.payload.repository.default_branch || departedDefaultBranch);
            // END TESTABLE SUPPORTED PULL CONTEXT
            if (!supportedPullContext) {
              core.info("Pull context does not target a supported same-repository default-branch review");
              return;
            }
            const workflowRun = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const contextChangeTime = Date.parse(workflowRun.data.created_at || "");
            if (!Number.isFinite(contextChangeTime)) {
              throw new Error("Could not determine the pull-context change event time");
            }
            const invalidationId = `sfl-codex-review:pull-context:at:${contextChangeTime}:${context.runId}`;
            const reviewerChecks = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner,
                repo,
                ref: pull.head.sha,
                check_name: "SFL Reviewer Gate Runner",
                filter: "all",
                per_page: 100,
              },
              response => response.data,
            );
            const existingInvalidation = reviewerChecks.some(
              check => check.app && check.app.id === 15368 && check.external_id === invalidationId,
            );
            if (existingInvalidation) {
              core.info(`Pull request #${pull.number} already has this exact invalidation; skipping rerun`);
              return;
            }
            const supersedingContext = reviewerChecks.find(
              check => check.app && check.app.id === 15368 &&
                supersedesInvalidation(check.external_id, contextChangeTime, context.runId),
            );
            if (supersedingContext) {
              core.info(`Pull request #${pull.number} has a newer invalidation context; skipping stale invalidation`);
              return;
            }
            const newerSuccess = reviewerChecks.some(
              check => check.app && check.app.id === 15368 &&
                check.conclusion === "success" &&
                check.external_id && check.external_id.startsWith(
                  `sfl-codex-review:pull:${pull.number}:base:${pull.base.sha.toLowerCase()}:`,
                ) &&
                check.external_id.includes(`:context:${encodeURIComponent(invalidationId)}:`),
            );
            if (newerSuccess) {
              core.info(`Pull request #${pull.number} already has a successful Codex gate completed after this context change`);
              return;
            }
            const livePull = await github.rest.pulls.get({
              owner, repo, pull_number: pull.number,
            });
            if (livePull.data.state !== "open" ||
                livePull.data.head.sha !== pull.head.sha ||
                livePull.data.base.sha !== pull.base.sha) {
              core.info(`Pull request #${pull.number} changed again after this context event; skipping stale invalidation`);
              return;
            }
            const reason = context.payload.action === "edited"
              ? `Pull request base changed to ${pull.base.ref} at ${pull.base.sha}; advance the branch to a new head, then request a Codex review.`
              : context.payload.action === "synchronize"
                ? `Pull request head changed to ${pull.head.sha}; request a Codex review for this exact head and base.`
                : context.payload.action === "reopened"
                  ? `Pull request #${pull.number} reopened; advance the branch to a new head before requesting review because earlier native artifacts cannot prove their base.`
                  : `Pull request #${pull.number} opened for ${pull.base.ref} at ${pull.base.sha}; request a Codex review for this exact pull request context.`;
            const finalChecks = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner,
                repo,
                ref: pull.head.sha,
                check_name: "SFL Reviewer Gate Runner",
                filter: "all",
                per_page: 100,
              },
              response => response.data,
            );
            const finalContextExists = finalChecks.some(
              check => check.app && check.app.id === 15368 &&
                (check.external_id === invalidationId ||
                 supersedesInvalidation(check.external_id, contextChangeTime, context.runId)),
            );
            const finalSuccess = finalChecks.some(
              check => check.app && check.app.id === 15368 &&
                check.conclusion === "success" &&
                check.external_id && check.external_id.startsWith(
                  `sfl-codex-review:pull:${pull.number}:base:${pull.base.sha.toLowerCase()}:`,
                ) &&
                check.external_id.includes(`:context:${encodeURIComponent(invalidationId)}:`),
            );
            if (finalContextExists || finalSuccess) {
              core.info(`Pull request #${pull.number} received a newer context or successful Codex gate while invalidation was running`);
              return;
            }
            await github.rest.checks.create({
              owner,
              repo,
              name: "SFL Reviewer Gate Runner",
              head_sha: pull.head.sha,
              status: "completed",
              conclusion: "failure",
              completed_at: new Date().toISOString(),
              details_url: pull.html_url,
              external_id: invalidationId,
              output: {
                title: "SFL Codex review invalidated",
                summary: reason,
                text: JSON.stringify({schema: 1, pull_number: pull.number,
                  action: context.payload.action, base_sha: pull.base.sha.toLowerCase()}),
              },
            });
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pull.head.sha,
              state: "failure",
              context: "SFL Reviewer Gate Runner",
              target_url: pull.html_url,
              description: "The pull request context changed after review",
            });
            core.info(reason);

  invalidate-base-advance:
    name: Invalidate Codex reviews after base advance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sfl-codex-review-base-advance-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Fail gates for pull requests whose base branch advanced
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            // BEGIN TESTABLE INVALIDATION ORDER
            function supersedesInvalidation(externalId, eventTime, runId) {
              const match = /^sfl-codex-review:(?:pull-context|base-advance):at:(\d+):(\d+)/.exec(externalId || "");
              if (!match) return false;
              const candidateTime = Number(match[1]);
              const candidateRunId = Number(match[2]);
              if (!Number.isSafeInteger(candidateTime) || !Number.isSafeInteger(candidateRunId)) return false;
              return candidateTime > eventTime ||
                (candidateTime === eventTime && candidateRunId > runId);
            }
            // END TESTABLE INVALIDATION ORDER

            const {owner, repo} = context.repo;
            const configuredBaseBranch = process.env.SFL_REVIEW_BASE_BRANCH || "";
            let baseRef = context.ref.replace(/^refs\/heads\//, "");
            let renamedBase = false;
            if (context.payload.deleted) {
              const repository = await github.rest.repos.get({owner, repo});
              const defaultBranch = repository.data.default_branch || "";
              if (!defaultBranch) throw new Error("Could not determine the repository default branch after base deletion");
              baseRef = defaultBranch;
              renamedBase = defaultBranch !== configuredBaseBranch;
            }
            const workflowRun = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const baseAdvanceTime = Date.parse(workflowRun.data.created_at || "");
            if (!Number.isFinite(baseAdvanceTime)) {
              throw new Error("Could not determine the base-advance event time");
            }
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", base: baseRef, per_page: 100,
            });
            const invalidatePull = async pull => {
              if (pull.base.ref !== baseRef) return;
              const headRepo = pull.head.repo && pull.head.repo.full_name;
              if (!headRepo || headRepo.toLowerCase() !== `${owner}/${repo}`.toLowerCase()) return;
              const invalidationId = `sfl-codex-review:base-advance:at:${baseAdvanceTime}:${context.runId}:${pull.number}`;
              const reviewerChecks = await github.paginate(
                github.rest.checks.listForRef,
                {
                  owner,
                  repo,
                  ref: pull.head.sha,
                  check_name: "SFL Reviewer Gate Runner",
                  filter: "all",
                  per_page: 100,
                },
                response => response.data,
              );
              const existingInvalidation = reviewerChecks.some(
                check => check.app && check.app.id === 15368 && check.external_id === invalidationId,
              );
              if (existingInvalidation) {
                core.info(`Pull request #${pull.number} already has this exact invalidation; skipping rerun`);
                return;
              }
              const supersedingContext = reviewerChecks.find(
                check => check.app && check.app.id === 15368 &&
                  supersedesInvalidation(check.external_id, baseAdvanceTime, context.runId),
              );
              if (supersedingContext) {
                core.info(`Pull request #${pull.number} has a newer invalidation context; skipping stale invalidation`);
                return;
              }
              const newerSuccess = reviewerChecks.some(
                check => check.app && check.app.id === 15368 &&
                  check.conclusion === "success" &&
                  check.external_id && check.external_id.startsWith(
                    `sfl-codex-review:pull:${pull.number}:base:${pull.base.sha.toLowerCase()}:`,
                  ) &&
                  check.external_id.includes(`:context:${encodeURIComponent(invalidationId)}:`),
              );
              if (newerSuccess) {
                core.info(`Pull request #${pull.number} already has a successful Codex gate completed after this base advance`);
                return;
              }
              const reason = renamedBase
                ? `Repository default branch changed from deployed SFL review base ${configuredBaseBranch} to ${baseRef}; redeploy SFL before requesting a new Codex review.`
                : `Pull request base ${baseRef} advanced to ${pull.base.sha}; update this PR branch from ${baseRef} to a new head, then request a Codex review with gh sfl review --repo ${owner}/${repo} --pr ${pull.number}.`;
              const finalChecks = await github.paginate(
                github.rest.checks.listForRef,
                {
                  owner,
                  repo,
                  ref: pull.head.sha,
                  check_name: "SFL Reviewer Gate Runner",
                  filter: "all",
                  per_page: 100,
                },
                response => response.data,
              );
              const finalContextExists = finalChecks.some(
                check => check.app && check.app.id === 15368 &&
                  (check.external_id === invalidationId ||
                   supersedesInvalidation(check.external_id, baseAdvanceTime, context.runId)),
              );
              const finalSuccess = finalChecks.some(
                check => check.app && check.app.id === 15368 &&
                  check.conclusion === "success" &&
                  check.external_id && check.external_id.startsWith(
                    `sfl-codex-review:pull:${pull.number}:base:${pull.base.sha.toLowerCase()}:`,
                  ) &&
                  check.external_id.includes(`:context:${encodeURIComponent(invalidationId)}:`),
              );
              if (finalContextExists || finalSuccess) {
                core.info(`Pull request #${pull.number} received a newer context or successful Codex gate while invalidation was running`);
                return;
              }
              await github.rest.checks.create({
                owner,
                repo,
                name: "SFL Reviewer Gate Runner",
                head_sha: pull.head.sha,
                status: "completed",
                conclusion: "failure",
                completed_at: new Date().toISOString(),
                details_url: pull.html_url,
                external_id: invalidationId,
                output: {title: "SFL Codex review invalidated", summary: reason},
              });
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: pull.head.sha,
                state: "failure",
                context: "SFL Reviewer Gate Runner",
                target_url: pull.html_url,
                description: "The reviewed base branch advanced after review",
              });
            };
            const failures = [];
            const batchSize = 10;
            for (let offset = 0; offset < openPulls.length; offset += batchSize) {
              const batch = openPulls.slice(offset, offset + batchSize);
              const results = await Promise.allSettled(batch.map(invalidatePull));
              results.forEach((result, index) => {
                if (result.status === "rejected") {
                  failures.push(`PR #${batch[index].number}: ${result.reason}`);
                }
              });
            }
            if (failures.length > 0) {
              throw new Error(`Base-advance invalidation failed after attempting every pull request:\n${failures.join("\n")}`);
            }
