            // BEGIN TESTABLE REQUIRED GATE REPAIR
            function requiredGateRepair(check, statuses) {
              if (!check || check.status !== "completed" ||
                  (check.conclusion !== "success" && check.conclusion !== "failure")) {
                return null;
