              response => response.data,
            );
            const requestTime = request && request.requestTime;
            const hasNewerMatchingRequest = (comments, checkRuns, statuses) =>
              hasNewerRegisteredRequest(
                comments,
                historicalRequestIdsFromStatuses(statuses, comments),
                contextToken,
                request,
