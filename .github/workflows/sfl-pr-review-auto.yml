              return;
            }
            const finalInvalidationRuns = await activeInvalidationRuns();
            if (finalInvalidationRuns.length > 0) {
              await failForPendingInvalidation(finalInvalidationRuns[0]);
              return;
            }
            const latestTriggerComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pullNumber, per_page: 100,
            });
            const latestRequestChecks = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner,
                repo,
                ref: currentHead,
                check_name: "SFL Reviewer Gate Runner",
                filter: "all",
                per_page: 100,
              },
              response => response.data,
            );
            if (!reviewContextUnambiguous(latestRequestChecks, pullNumber, currentBase)) {
              core.info("The native review base became ambiguous before publication; advance to a new head");
              return;
            }
            const latestRequestStatuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              {owner, repo, ref: currentHead, per_page: 100},
            );
            await refreshRequesterPermissions(latestTriggerComments, latestRequestStatuses);
            const latestOriginalRequest = latestTriggerComments.find(comment => comment.id === request.comment.id);
            if (hasHistoricalBaseConflict(latestTriggerComments, latestRequestStatuses) || latestTriggerComments.some(comment =>
                historicalRequestIdsFromStatuses(latestRequestStatuses, latestTriggerComments).has(comment.id) &&
                (comment.body || "").includes(headMarker) && !(comment.body || "").includes(baseMarker))) {
              core.setFailed("Historical registered request belongs to another base");
              return;
            }
            if (!latestOriginalRequest || !isOwnerRequest(latestOriginalRequest) ||
                !registeredRequestIdsFromStatuses(latestRequestStatuses, latestTriggerComments).has(request.comment.id) ||
                latestOriginalRequest.body !== request.comment.body ||
                latestOriginalRequest.updated_at !== latestOriginalRequest.created_at) {
