              ? "SFL Codex review passed"
              : "SFL Codex review failed";
            const checks = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner,
                repo,
                ref: currentHead,
                check_name: "SFL Reviewer Gate Runner",
                filter: "all",
                per_page: 100,
