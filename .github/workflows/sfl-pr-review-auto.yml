            };
            // END TESTABLE ACTIVE INVALIDATIONS
            const failForPendingInvalidation = async pendingRun => {
              if (!artifactBindsCurrentHead) {
                core.info("The Codex artifact does not bind to the current head; it cannot complete the pending request");
                return;
              }
              const reason = `${pendingRun.event} invalidation run ${pendingRun.id} is still active; the Codex result cannot supersede its invalidation`;
              let externalId = `sfl-codex-review:pending-invalidation:${pendingRun.id}:artifact:${artifactIdentity}`;
              if (pendingRequest) {
                const contextMatch = /;context=(.*?) -->/.exec(pendingRequest.comment.body || "");
                if (contextMatch && contextMatch[1]) {
                  externalId = requestGateExternalId(
                    pullNumber,
                    currentBase,
                    contextMatch[1],
                    pendingRequest.comment.id,
                    pendingRequest.requestTime,
                    artifactIdentity,
                  );
                }
              }
              await github.rest.checks.create({
                owner,
                repo,
                name: "SFL Reviewer Gate Runner",
                head_sha: currentHead,
                status: "completed",
                conclusion: "failure",
                completed_at: new Date().toISOString(),
                details_url: artifact.html_url || pull.data.html_url,
                external_id: externalId,
                output: {title: "SFL Codex review blocked", summary: reason},
              });
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: currentHead,
                state: "failure",
                context: "SFL Reviewer Gate Runner",
                target_url: artifact.html_url || pull.data.html_url,
                description: "An invalidation is still active for this pull request",
              });
              core.setFailed(reason);
            };
            const pullLifecycleToken = async () => {
              const events = await github.paginate(
                "GET /repos/{owner}/{repo}/issues/{issue_number}/events",
                {owner, repo, issue_number: pullNumber, per_page: 100},
              );
              return events.filter(event => event.event === "closed" || event.event === "reopened")
                .reduce((latest, event) => Math.max(latest, event.id || 0), 0);
            };
            const initialLifecycleToken = await pullLifecycleToken();
            let pendingInvalidationRuns = [];
            let observedInvalidationRun = false;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              pendingInvalidationRuns = await activeInvalidationRuns();
              if (pendingInvalidationRuns.length > 0) {
                observedInvalidationRun = true;
                core.info(`Waiting for ${pendingInvalidationRuns[0].event} invalidation run ${pendingInvalidationRuns[0].id} before publishing the Codex result`);
              } else if (observedInvalidationRun || attempt >= 5) {
