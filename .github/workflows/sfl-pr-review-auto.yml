              const expectedState = check.conclusion;
              const latestGateStatus = statuses.find(status =>
                status.context === "SFL Reviewer Gate Runner" &&
                ((status.creator && status.creator.login) || "").toLowerCase() === "github-actions[bot]");
              return latestGateStatus && latestGateStatus.state === expectedState
                ? null
                : {state: expectedState};
            }
